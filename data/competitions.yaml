# competitions.yaml
#
# SCHEMA
# ======
# id:               unique slug
# name:             display name
# type:             league | cup | supercup | international_league |
#                   international_cup
# nation_id:        host nation (null for multi-nation international competitions)
# founded_year:     first season this competition exists; engine skips it before
#                   this year
# prestige:         base prestige value (0-10000); actual prestige awarded is
#                   scaled by the host nation's current prestige:
#                     award = base_prestige × (nation_prestige / 10000)
#                   for international competitions the scaling uses the average
#                   prestige of all participating nations
# tier:             division level within a nation (1 = top flight)
#                   null for cup and international competitions
# frequency:        how often the competition runs, in years (default 1)
#                   used for Olympics (4) and World Cup (4)
#
# timing:           when in the year the competition is resolved
#   season:         runs across the full domestic season (league, cup)
#   pre_season:     played at the very start of the new season, before the
#                   league kicks off; participants are resolved from the
#                   PREVIOUS season's results — belongs to the new season's
#                   calendar so stats and trophies count toward that year
#   end_of_season:  resolved at the end of the season before summer break;
#                   used for competitions that historically ran mid-season
#                   but are treated as end-of-season for now
#   summer:         resolved in the summer between seasons (Olympics, WC)
#
# match_day:        preferred day type for scheduling fixtures
#   primary:        uses the primary match day for this season year
#                   (derived from rules.get_match_days())
#   midweek:        Wednesday / Tuesday slot
#   flexible:       engine picks the next available slot
#
# participants:     how teams/nations qualify
#   type:           all_members | top_n | qualified | fixed | supercup
#
#   supercup type uses:
#     slots:        ordered list of participant slots; each slot has:
#       source:     competition_id to resolve this slot from
#       role:       winner | runner_up
#     fallbacks:    list of slots to try if two resolved teams are the same club;
#                   tried in order — first one that resolves to a new (unseen)
#                   team replaces the duplicate slot
#
# draw_rules:       how a draw is resolved (supercup / cup competitions only)
#   extra_time:     true | false — play 30 minutes of extra time before going
#                   to penalties
#   penalties:      true | false — use a penalty shootout if still level
#   replay:         true | false — schedule a replay on a later date
#   Note: only one of penalties or replay should be true; extra_time only
#   applies when penalties is also true
#
# legs:             number of legs (1 = single match, 2 = home-and-away)
#                   two-leg logic is not yet implemented; set to 1 for now
#
# rounds:           for cup/supercup competitions, prestige points awarded
#                   per exit round; indexed from first round (index 0) to
#                   winner (last index); teams receive points ONLY for the
#                   round they exit at, not cumulatively
 
# ── Domestic competitions — Myria ────────────────────────────────────────────

- id: lhiga_alhika
  name: Lhiga Alhika
  type: league
  nation_id: myria
  founded_year: 1908
  prestige: 7000
  tier: 1
  frequency: 1
  timing: season
  match_day: primary
  participants:
    type: all_members

- id: kopa_protonas
  name: Kopa Protonas
  type: cup
  nation_id: myria
  founded_year: 1896
  prestige: 5000
  tier: null
  frequency: 1
  timing: season
  match_day: midweek
  participants:
    type: all_members
  rounds:
    # prestige per exit round: [R1, R2, QF, SF, Final, Winner]
    # scaled by competition prestige × nation prestige factor at award time
    - 50    # eliminated in round 1
    - 100   # eliminated in round 2
    - 200   # eliminated in quarter-final
    - 350   # eliminated in semi-final
    - 600   # runner-up
    - 1000  # winner

- id: myria_supercup
  name: Myrian Supercup
  type: supercup
  nation_id: myria
  founded_year: 1988
  prestige: 4000
  tier: null
  frequency: 1
  timing: pre_season
  match_day: flexible
  legs: 1
  participants:
    type: supercup
    slots:
      - { source: lhiga_alhika,     role: winner } # slot 0: prote_kategorias winner
      - { source: kopa_protonas,    role: winner } # slot 1: protonas_cup winner
    fallbacks:
      # if the two slots resolve to the same team, try these slots in order
      - { source: kopa_protonas, role: runner_up }
      - { source: lhiga_alhika,  role: runner_up }
  draw_rules:
    extra_time: true
    penalties: true
    replay: false
  rounds:
    - 400   # runner-up
    - 800   # winner


# ── International competitions ────────────────────────────────────────────────

- id: british_home_championship
  name: British Home Championship
  type: international_league
  nation_id: null
  founded_year: 1883
  prestige: 6000
  tier: null
  frequency: 1
  # Historically ran January–April (mid-season).
  # Set to end_of_season for now — the timing field allows the engine to
  # switch this to a mid-season international window later without any
  # changes to this file.
  timing: end_of_season
  match_day: flexible
  participants:
    type: fixed
    nations: [england, scotland, wales, ireland]

- id: olympics_football
  name: Olympic Football Tournament
  type: international_cup
  nation_id: null
  founded_year: 1908          # first official Olympic football tournament
  prestige: 8000
  tier: null
  frequency: 4               # every 4 years
  timing: summer
  match_day: flexible
  participants:
    type: qualified
    count: 8                  # starts small, expands as more nations develop
  rounds:
    - 100   # group stage exit
    - 300   # quarter-final exit
    - 600   # semi-final exit
    - 900   # bronze medal / runner-up
    - 1500  # gold medal winner

- id: fifa_world_cup
  name: FIFA World Cup
  type: international_cup
  nation_id: null
  founded_year: 1930
  prestige: 10000
  tier: null
  frequency: 4
  timing: summer
  match_day: flexible
  participants:
    type: qualified
    count: 13                 # 13 teams in the first World Cup, expands later
  rounds:
    - 200   # group stage / first round exit
    - 500   # quarter-final exit
    - 900   # semi-final exit
    - 1400  # runner-up
    - 2500  # winner