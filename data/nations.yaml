# ── Real nations — early clubs exist, no association yet at 1896 ─────────────
#
# These nations have football activity but no organised national body.
# They cannot participate in international competitions until their
# founded_year is reached. The engine generates their squads from that
# point onward.
#
# Prestige starting values are lower, reflecting their undeveloped state.
# Their prestige_weights lean heavily on international results since their
# domestic leagues don't exist yet — international performance is their
# primary route to prestige growth early on.

