# nations.yaml
#
# SCHEMA
# ======
# id:                 unique slug — used as foreign key in teams.yaml,
#                     competitions.yaml, and on player nationality fields
# name:               display name
# is_fictional:       fictional nations use Myrian name generators and are
#                     fully playable; real nations host generated squads for
#                     international competitions
# founded_year:       year the nation was founded;
#                     the nation does not participate in international
#                     competitions before this year
# prestige:           starting value on the 0-10000 scale; tier is derived
#                     from this number, never stored separately
#
#                     Tier thresholds:
#                       0    – 1000  → lower-tier
#                       1001 – 2500  → low-tier
#                       2501 – 5000  → mid-tier
#                       5001 – 7500  → high-tier
#                       7501 – 10000 → top-tier
#
# prestige_weights:   how nation prestige is updated each season
#   league:           weight given to domestic league performance (0.0–1.0)
#   international:    weight given to national team results (0.0–1.0)
#                     the two weights should sum to 1.0
#
# prestige_decay:     fraction of prestige lost each season before gains
#                     are applied (e.g. 0.03 = 3% decay per season)
# prestige_floor:     minimum prestige value — nation never falls below this
#
# tier_change_min_seasons: seasons a nation must spend above/below a tier
#                     threshold before the tier officially changes; prevents
#                     single-season variance from flipping tiers
#
# name_generator:     which name pool to use when generating players
#                     currently supported: myrian, english, scottish,
#                     welsh, irish, dutch, danish, belgian, swiss
#
# eligible_for_international: whether this nation fields a national team
# fa_founded_year:    year the national FA/team is created; defaults to founded_year
# fifa_membership_year: year the nation can enter FIFA/World Cup-level competitions;
#                     defaults to fa_founded_year
# continental_membership_year: year the nation can enter confederation tournaments;
#                     defaults to fa_founded_year
# dissolved_year:     optional year the nation ceases to exist in the timeline
#
# predecessor_id:     optional slug of the immediate predecessor nation
#
# successor_of:       optional list of nation slugs whose football records/statistics
#                     this nation legally inherits

# ── Fictional nations ─────────────────────────────────────────────────────────

- id: myria
  name: Myria
  is_fictional: true
  founded_year: 1896
  fa_founded_year: 1890
  fifa_membership_year: 1950
  continental_membership_year: 1971
  prestige: 1200
  prestige_weights:
    league: 0.60
    international: 0.40
  prestige_decay: 0.03
  prestige_floor: 500
  tier_change_min_seasons: 3
  name_generator: myrian
  eligible_for_international: true
  regions:
    - id: myr_bridia
      name: Bridia
      talent_modifier: 1.0   # multiplier on PA caps for players born here
                              # starts at 1.0 — shifts dynamically at runtime
    - id: myr_masia
      name: Masia
      talent_modifier: 1.0
    - id: myr_lunia
      name: Lunia
      talent_modifier: 1.0
    - id: myr_vetia_and_sileia
      name: Vetia & Sileia
      talent_modifier: 1.0


