# teams.yaml
#
# SCHEMA
# ======
# id:               unique slug — referenced by squads files and competition
#                   participant lists
# name:             display name
# nation_id:        foreign key → nations.yaml
# founded_year:     year the club was founded; the engine does not generate
#                   this team before this season year
# prestige:         starting value on the 0-10000 scale (see nations.yaml
#                   for tier thresholds)
# attack:           starting attacking strength (used until squad CA takes over)
# midfield:         starting midfield strength
# defense:          starting defensive strength
# competitions:     list of competition_ids this team belongs to at founding
#                   the engine enrolls the team in these competitions from
#                   founded_year onward
#
# NOTE ON SQUADS
# Teams do not generate squads at runtime. Instead, squads are loaded from
# data/squads/<season_year>.yaml on first launch. If no squad file exists
# for a team in a given season, the engine falls back to generate_squad()
# using the team's average CA — this covers newly promoted clubs and
# expansion teams that don't have pre-written squads.


